[package]
name = "bevy_flair_css_selector"
version = "0.9.0"
edition = "2024"
description = "Bevy UI styling using CSS"
license = "MIT OR Apache-2.0"
categories = ["games", "game-development"]
keywords = ["style", "animations", "bevy", "css"]
repository = "https://github.com/eckz/bevy_flair"
rust-version = "1.96.0"

[lints.rust]
unsafe_code = "forbid"
## TODO: CHANGE TO "warn"
missing_docs = "allow"

[lints.clippy]
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"


[dependencies]
bitflags = "2.8"
rustc-hash = "2.1"
smol_str = "0.2"
smallvec = { version = "1.16", features = ["const_new"] }
bevy_ecs = { workspace = true }
# TODO, Add feature for this
bevy_reflect = { workspace = true }

tracing = "0.1"

cssparser = { workspace = true }
selectors = { workspace = true }
precomputed-hash = { version = "0.1" }

[features]
ghost_elements = []

[dev-dependencies]
itertools = { version = "0.15" }
rand = "0.10.3"