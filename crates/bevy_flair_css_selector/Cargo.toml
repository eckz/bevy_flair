[package]
name = "bevy_flair_css_selector"
version = "0.9.0"
edition = "2024"
description = "Bevy UI styling using CSS"
license = "MIT OR Apache-2.0"
categories = ["games", "game-development"]
keywords = ["style", "animations", "bevy", "css"]
repository = "https://github.com/eckz/bevy_flair"
rust-version = "1.96.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"


[dependencies]
bitflags = "2.8"
rustc-hash = "2.1"
itertools = "0.15"
smol_str = "0.2"
smallvec = "1.16"
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_text = { workspace = true }
bevy_ui = { workspace = true }

tracing = "0.1"

cssparser = { workspace = true }
selectors = { workspace = true }
precomputed-hash = { version = "0.1" }

[dev-dependencies]
rand = "0.10.3"